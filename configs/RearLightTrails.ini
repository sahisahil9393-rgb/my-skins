# ==========================================================
#  RearLightTrails v14.0 - Ultimate Config Berpenjelasan
# ==========================================================

# --- PENGATURAN SISTEM & LAMPU ---
# Activated       = 1 (Menyalakan Trail), 0 (Mematikan Trail)
# AlwaysOnLights  = 1 (Lampu mobil player & NPC selalu menyala 24 Jam)
# EngineOffOnExit = 1 (Mesin otomatis mati saat CJ keluar dari mobil)
Activated = 1
AlwaysOnLights = 1
EngineOffOnExit = 1

# --- UKURAN & BENTUK TRAIL ---
# EnableLeft  = 1 (Nyalakan trail di lampu kiri), 0 (Matikan)
# EnableRight = 1 (Nyalakan trail di lampu kanan), 0 (Matikan)
# Length      = Batas maksimal panjang trail (Makin besar angkanya, makin panjang ekornya)
# WaitMs      = Jeda rekam titik aspal (Standar 15, makin kecil angkanya trail makin rapat)
# Thickness   = Ketebalan dasar dari inti trail
EnableLeft = 1
EnableRight = 1
Length = 40
WaitMs = 5
Thickness = 0.010

# --- PENGATURAN KECEPATAN (RESUME & SHRINK LOGIC) ---
# MinSpeed      = Kecepatan MINIMAL (km/jam) agar trail mulai aktif dan muncul
# FadeWithSpeed = 1 (Trail menyusut perlahan ke arah lampu sampai berhenti total / 0 km/jam)
# SpeedStart    = Kecepatan dimana trail mulai mencapai batas panjang maksimalnya
# SpeedFull     = Kecepatan puncak untuk perhitungan ketebalan maksimal
# SpeedThicken  = 1 (Trail makin melebar/tebal kalau mobil makin ngebut)
# SpeedMaxMult  = Berapa kali lipat trail menebal saat mencapai SpeedFull
# SpeedFadeIn   = Kecepatan (km/jam) untuk efek memudar halus saat mobil nyaris berhenti
MinSpeed = 90.0
FadeWithSpeed = 1
SpeedStart = 130
SpeedThicken = 1
SpeedFull = 150
SpeedMaxMult = 1.00
SpeedFadeIn = 30.0

# --- WARNA INTI (CORE TRAIL) ---
# ColorPreset = 0 (Bebas/Custom), 1 (Polisi), 2 (Api), 3 (Es), 4 (Toxic), 5 (Neon Pink)
# ColorR, ColorG, ColorB = Kode warna RGB untuk bagian tengah (INTI) trail (Hanya fungsi jika ColorPreset = 0)
# Alpha       = Tingkat transparansi trail (0 sampai 256)
# TwoColor    = 1 (Aktifkan efek gradasi, warna ujung dan pangkal trail berbeda)
# ColorR2, ColorG2, ColorB2 = Kode warna RGB untuk ujung ekor (Jika TwoColor = 1)
ColorPreset = 0
ColorR = 255
ColorG = 0
ColorB = 0
Alpha = 255
TwoColor = 0
ColorR2 = 255
ColorG2 = 30
ColorB2 = 30

# --- WARNA GLOW (AURA CAHAYA NORMAL) ---
# Glow        = 1 (Nyalakan efek cahaya luar/neon yang membungkus inti trail)
# GlowLayers  = Jumlah lapisan cahaya neon (1 sampai 5 lapis)
# GlowColorR, GlowColorG, GlowColorB = Kode warna RGB untuk AURA NORMAL saat mobil jalan biasa
Glow = 1
GlowLayers = 5
GlowColorR = 255
GlowColorG = 30
GlowColorB = 30

# --- WARNA GLOW (KHUSUS NITRO) ---
# ReactNitro  = 1 (HANYA warna GLOW LUARNYA yang berubah saat api nitro menyala di knalpot)
# NitroMode   = 1 (Mendeteksi otomatis api nitro dari knalpot mobil)
# NitroMult   = Berapa kali lipat ukuran GLOW membesar saat Nitro meledak
# BoostAccel  = Batas akselerasi untuk mendeteksi dorongan fisik secara murni (Jika NitroMode = 2)
# NitroColorR, NitroColorG, NitroColorB = Kode warna RGB khusus untuk GLOW saat NITRO AKTIF
ReactNitro = 1
NitroMode = 1
NitroMult = 2.00
BoostAccel = 35
NitroColorR = 60
NitroColorG = 160
NitroColorB = 255

# --- EFEK TAMBAHAN KENDARAAN ---
# ReactBrake  = 1 (Warna Inti dan Glow berubah jadi merah terang saat direm)
# Smooth      = 1 (Trail melengkung sangat mulus seperti pita saat mobil berbelok)
# SmoothSubdiv= Tingkat kehalusan lengkungan trail (2 sampai 8)
ReactBrake = 1
Smooth = 1
SmoothSubdiv = 4

# --- RAINBOW MODE (WARNA-WARNI) ---
# Rainbow       = 1 (Trail berubah warna pelangi secara otomatis)
# RainbowMode   = 0 (Warna berganti seiring waktu), 1 (Warna berganti sepanjang ekor)
# RainbowSpeed  = Kecepatan pergantian warna pelangi
# RainbowOffset = Jarak pergeseran warna antar titik
Rainbow = 0
RainbowMode = 0
RainbowSpeed = 1
RainbowOffset = 0
